services:
  development:
    image: sbtscala/scala-sbt:eclipse-temurin-alpine-21.0.13_9_1.13.1_3.9.0@sha256:2ef53f0841cd4d506e438ac495d44f7fe11cda34524d97df245b6302d10bd409
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ~/.cache
        target: /root/.cache
