services:
  development:
    image: sbtscala/scala-sbt:eclipse-temurin-alpine-21.0.12_8_1.13.0_2.12.21@sha256:7e75d4be54dca5b18cd9e3aa6ce4d991c0a27cb442ee7e159ff68d7f46914237
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ~/.cache
        target: /root/.cache
      - type: bind
        source: ~/.ivy2
        target: /root/.ivy2
      - type: bind
        source: ~/.sbt
        target: /root/.sbt
    working_dir: /app
