services:
  development:
    image: sbtscala/scala-sbt:eclipse-temurin-alpine-21.0.11_10_1.12.11_3.3.7@sha256:71f303d98fda2aff96d84b20bed5e5d1f6e488f1219f3e48eab610ebdbc59e42
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ~/.cache
        target: /root/.cache
      - type: bind
        source: ~/.ivy2
        target: /root/.ivy2
      - type: bind
        source: ~/.sbt
        target: /root/.sbt
    working_dir: /app
