services:
  development:
    image: sbtscala/scala-sbt:eclipse-temurin-alpine-21.0.11_10_1.12.11_3.3.7@sha256:c3562c52d16a03968e953ed494438e8d5da7740b81bb3ee8ad72f7e44daaa2fe
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ~/.cache
        target: /root/.cache
      - type: bind
        source: ~/.ivy2
        target: /root/.ivy2
      - type: bind
        source: ~/.sbt
        target: /root/.sbt
    working_dir: /app
