services:
  development:
    image: sbtscala/scala-sbt:eclipse-temurin-alpine-21.0.11_10_1.12.11_3.3.7@sha256:8dfb2c04e117102f91e96cdab2543d0680014bde4d54a638b33e4b31fb058e6f
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ~/.cache
        target: /root/.cache
